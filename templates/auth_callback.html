<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Fyers Login — Copy URL</title>
  <style>
    body { background: #f5f5f0; font-family: 'Segoe UI', Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #fff; border: 2px solid #4682b4; border-radius: 10px; padding: 36px 32px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 2px 12px rgba(70,130,180,0.15); }
    h2 { color: #4682b4; margin-bottom: 12px; }
    p  { font-size: 0.9rem; color: #555; margin-bottom: 18px; }
    .url-box { background: #e8eef4; border: 1px solid #b0c4de; border-radius: 6px; padding: 10px; font-size: 0.78rem; word-break: break-all; color: #2c3e50; margin-bottom: 18px; text-align: left; }
    button { background: #4682b4; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #315f8a; }
    .note { font-size: 0.78rem; color: #888; margin-top: 14px; }
  </style>
</head>
<body>
<div class="box">
  <h2>✅ Fyers Login Successful</h2>
  <p>Copy the full URL below and paste it into the scanner dashboard.</p>
  <div class="url-box" id="current-url"></div>
  <button onclick="copyUrl()">📋 Copy URL</button>
  <div class="note">After copying, go back to the dashboard, paste it in the box and click <b>Submit Token</b>.</div>
</div>
<script>
  const url = window.location.href;
  document.getElementById("current-url").textContent = url;
  function copyUrl() {
    navigator.clipboard.writeText(url).then(() => {
      document.querySelector("button").textContent = "✅ Copied!";
    });
  }
</script>
</body>
</html>
